[project]
name = "streambridge"
version = "0.1.2"
description = "StreamBridge is a pipeline platform built on Debezium that captures row-level changes from your databases and streams them through Apache Kafka to any sink."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.93",
    "colorlog>=6.12.0",
    "confluent-kafka>=2.15.1",
    "fastavro>=1.12.2",
    "flask>=3.1.3",
    "playwright>=1.62.0",
    "psycopg2-binary>=2.9.13",
    "pymysql>=1.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.32",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

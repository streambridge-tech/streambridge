# One container per service for the CI end-to-end job.
# Hostnames match the connector configs: kafka, mysql, registry, schema-registry.
services:
  kafka:
    image: quay.io/debezium/kafka:3.7.0.Final
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: oh-sxaDRTcyAr6pFRbXyzA
      NODE_ID: 1
      NODE_ROLE: combined
      HOST_NAME: kafka
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  registry:
    image: apicurio/apicurio-registry-mem:2.6.2.Final
    hostname: registry
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    platform: linux/amd64
    hostname: schema-registry
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mysql:
    image: quay.io/debezium/example-mysql:3.7.0.Final
    hostname: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: debezium
      MYSQL_USER: mysqluser
      MYSQL_PASSWORD: mysqlpw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdebezium"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    hostname: connect
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      registry:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    volumes:
      - ./plugins/avro-converter:/kafka/connect/avro-converter
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: ci_connect_configs
      OFFSET_STORAGE_TOPIC: ci_connect_offsets
      STATUS_STORAGE_TOPIC: ci_connect_statuses
      ENABLE_APICURIO_CONVERTERS: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

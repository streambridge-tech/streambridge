name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install pre-commit

      - name: Require a newer version
        if: github.event_name == 'pull_request'
        run: python scripts/release_version.py check-pr

      - name: Pre-commit
        run: pre-commit run --all-files

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Frontend test
        run: node --test tests/js/connector_modal.test.mjs

      - name: Built pages match the views
        run: |
          python build.py
          git diff --exit-code -- static/dist

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamBridge — Documentation</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/docs.css">
</head>
<body>

<nav class="icon-rail" id="iconRail">

  <div class="rail-header">

    <div class="rail-brand">
      <div class="rail-brand-name">StreamBridge</div>
      <div class="rail-brand-sub">CDC Platform</div>
    </div>
  </div>

  <div class="rail-section">
    <div class="rail-section-label">CDC</div>
    <a class="rail-item" id="rail-connectors" href="/connectors">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 7-4 5 4 5"/><path d="M13 6 11 18"/><path d="m15 7 4 5-4 5"/></svg>
      <span class="rail-label">Connectors</span>
    </a>
    <a class="rail-item" id="rail-kafka-topics" href="/kafka-topics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="13" y2="15"/></svg>
      <span class="rail-label">Kafka Topics</span>
    </a>
    <a class="rail-item" id="rail-schema-registry" href="/schema-registry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="1" width="6" height="5" rx="1"/><rect x="1" y="14" width="6" height="5" rx="1"/><rect x="9" y="14" width="6" height="5" rx="1"/><rect x="17" y="14" width="6" height="5" rx="1"/><line x1="12" y1="6" x2="12" y2="11"/><line x1="4" y1="11" x2="20" y2="11"/><line x1="4" y1="11" x2="4" y2="14"/><line x1="12" y1="11" x2="12" y2="14"/><line x1="20" y1="11" x2="20" y2="14"/></svg>
      <span class="rail-label">Schema Registry</span>
    </a>
    <a class="rail-item" id="rail-connections" href="/connections">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>
      <span class="rail-label">Connections</span>
    </a>
  </div>

  <div class="rail-section">
    <div class="rail-section-label">Platform</div>
    <a class="rail-item" id="rail-plugins" href="/plugins">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      <span class="rail-label">Plugins</span>
    </a>
    <a class="rail-item" id="rail-alerts" href="/alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="rail-label">Alerts</span>
    </a>
  </div>

  <div class="rail-section">
    <div class="rail-section-label">Control Plane</div>
    <div class="rail-group collapsed" id="rail-admin" style="display:none;">
      <button type="button" class="rail-item rail-group-hdr" id="rail-admin-hdr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>
        <span class="rail-label">Access Control</span>
        <svg class="rail-group-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="rail-subitems">
        <a class="rail-subitem" href="/admin#users" data-sec="users">Users</a>
        <a class="rail-subitem" href="/admin#roles" data-sec="roles">Roles and Privileges</a>
      </div>
    </div>
    <a class="rail-item active" id="rail-docs" href="/docs">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span class="rail-label">Docs</span>
    </a>
  </div>

  <div class="rail-bottom">
    <div class="rail-group collapsed" id="rail-phase2" style="display:none;">
      <button type="button" class="rail-item rail-group-hdr" id="rail-phase2-hdr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h6l4 4h6"/><path d="M4 18h6l4-4h6"/><circle cx="4" cy="6" r="1.5"/><circle cx="4" cy="18" r="1.5"/><circle cx="20" cy="10" r="1.5"/><circle cx="20" cy="14" r="1.5"/></svg>
        <span class="rail-label">Phase 2</span>
        <svg class="rail-group-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="rail-subitems">
        <a class="rail-subitem" id="rail-pipelines" href="/pipelines">Pipelines</a>
        <a class="rail-subitem" id="rail-rca" href="/rca">RCA</a>
      </div>
    </div>
  </div>

</nav>


<div class="main">
  <header class="topbar">
    <span class="topbar-title">Documentation</span>
    <button class="topbar-account" id="topAccount" style="display:none;">
      <span class="topbar-acct-avatar" id="topAcctAvatar">?</span>
      <span class="topbar-acct-role" id="topAcctRole">All roles</span>
      <svg class="topbar-acct-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </header>
  <div class="content">

<div class="view active docs-view" id="view-docs">
  <aside class="docs-sidebar" aria-label="Documentation topics">
    <div class="docs-nav-heading">
      <strong>Documentation</strong>
      <button type="button" id="docsMenu" aria-expanded="false" aria-controls="docsNav">Topics</button>
    </div>
    <label class="docs-search-label" for="docsSearch">Search documentation</label>
    <input type="search" id="docsSearch" placeholder="Search topics and examples" autocomplete="off">
    <nav id="docsNav" aria-label="Topics"></nav>
    <p id="docsEmpty" role="status" hidden>No matching topics.</p>
  </aside>
  <div class="docs-reading" id="docsReading">
    <article id="docsContent" aria-label="Documentation article"></article>
    <p class="docs-status" id="docsStatus" role="status" aria-live="polite"></p>
  </div>
</div>


  </div>
</div>


<script src="/static/js/rbac_nav.js"></script>
<script src="/static/js/tree_icons.js"></script>
<script src="/static/js/docs.js"></script>

</html>

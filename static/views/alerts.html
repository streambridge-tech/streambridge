<!-- ════ ALERTS VIEW ════ -->
<div class="conn-tree-layout">
  <div class="conn-tree-sidebar">
    <div class="conn-tree-toolbar">
      <div class="conn-tree-search-wrap">
        <svg class="conn-tree-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="conn-tree-search" placeholder="Search alerts…" oninput="filterAlerts(this.value)">
      </div>
      <button class="conn-tree-new-btn" onclick="openAlertModal()" title="New Alert">
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="conn-tree-body" id="alertsListBody"></div>
  </div>
  <div class="conn-tree-resizer" data-tree-pane="resize" role="separator" aria-orientation="vertical" aria-label="Resize list"></div>
  <div class="conn-tree-detail" id="alertDetail">
    <div class="conn-detail-empty">
      <div class="conn-detail-empty-icon">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <p>Select an alert</p>
      <span>Click any alert in the list to view its details</span>
    </div>
  </div>
</div>

<!-- ALERT MODAL -->
<div id="alertModal" onclick="alertModalBgClick(event)" style="display:none;position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.45);overflow:auto;backdrop-filter:blur(2px);">
  <div class="pm-box" onclick="event.stopPropagation()">
    <div class="pm-header">
      <div class="pm-header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <div class="pm-header-text">
        <div id="alertModalTitle" class="pm-title">New Alert</div>
        <div class="pm-subtitle">One policy per connector. First matching rule wins.</div>
      </div>
      <button onclick="closeAlertModal()" class="pm-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="pm-body">
      <input type="hidden" id="alertFormId">
      <div class="pm-field">
        <label class="pm-label">Connector <span class="pm-required">*</span></label>
        <div class="pm-select-wrap">
          <select class="pm-select" id="alertFormConnector">
            <option value="">Select a connector…</option>
          </select>
          <svg class="pm-select-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="pm-field">
        <label class="pm-label">Rules <span class="pm-required">*</span></label>
        <div id="alertFormRules" class="al-rules"></div>
        <button type="button" class="pm-btn-cancel al-rule-add" onclick="addAlertRuleRow()">Add rule</button>
      </div>
      <div class="pm-field">
        <label class="pm-label">Check every <span class="pm-required">*</span></label>
        <div class="pm-min-wrap">
          <input class="pm-input" id="alertFormEvery" type="number" min="1" step="1" placeholder="Minutes" inputmode="numeric">
          <span class="pm-min-unit">min</span>
        </div>
      </div>
      <div class="pm-field">
        <label class="pm-label">Channels <span class="pm-required">*</span></label>
        <div class="pm-select-wrap al-ch-dd" id="alertFormChannelDd">
          <button type="button" class="pm-select al-ch-dd-btn" id="alertFormChannelBtn" onclick="toggleAlertChannelDd(event)">
            <span id="alertFormChannelLabel">Select channels…</span>
          </button>
          <svg class="pm-select-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          <div class="al-ch-dd-menu" id="alertFormChannelMenu"></div>
        </div>
      </div>
    </div>
    <div class="pm-footer">
      <button class="pm-btn-cancel" onclick="closeAlertModal()">Cancel</button>
      <button class="pm-btn-save" onclick="saveAlert()">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save Alert
      </button>
    </div>
  </div>
</div>

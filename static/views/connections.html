<!-- ════ CONNECTIONS VIEW ════ -->
<div class="view" id="view-connections">
  <div class="conn-tree-layout">

    <!-- Left sidebar tree -->
    <div class="conn-tree-sidebar">
      <div class="conn-tree-toolbar">
        <div class="conn-tree-search-wrap">
          <svg class="conn-tree-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="conn-tree-search" placeholder="Search connections…" oninput="filterConnTree(this.value)">
        </div>
        <button class="conn-tree-new-btn" onclick="openConnTypeModal()" title="New Connection">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

      </div>
      <div class="conn-tree-body" id="connTreeBody"></div>
    </div>
    <div class="conn-tree-resizer" data-tree-pane="resize" role="separator" aria-orientation="vertical" aria-label="Resize list"></div>

    <!-- Right detail panel -->
    <div class="conn-tree-detail" id="connTreeDetail"></div>

  </div>
  <div class="conn-secret-modal-root" id="connSecretModal" hidden></div>
</div>

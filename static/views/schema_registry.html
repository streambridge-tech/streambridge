<!-- ════ SCHEMA REGISTRY VIEW ════ -->
<div class="view" id="view-schema-registry">
  <div class="conn-tree-layout">

    <!-- Left sidebar tree -->
    <div class="conn-tree-sidebar" id="schemaTreeSidebar">
      <div class="conn-tree-toolbar">
        <div class="conn-tree-search-wrap">
          <svg class="conn-tree-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="conn-tree-search" id="schemaSearchInput" placeholder="Search registries, groups, schemas…" oninput="filterSchemaTree(this.value)">
        </div>
        <button class="conn-tree-icon-btn" type="button" onclick="loadSchemaRegistries(true)" title="Refresh registries" aria-label="Refresh registries">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3"/></svg>
        </button>
        <button class="conn-tree-new-btn" onclick="window.location.href='/connections?new=schema-registry'" title="Add schema registry connection" aria-label="Add schema registry connection">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

      </div>
      <div class="conn-tree-body" id="schemaTreeBody"></div>
    </div>
    <div class="conn-tree-resizer" id="schemaTreeResizer" role="separator" aria-orientation="vertical" aria-label="Resize schema tree"></div>

    <!-- Right detail panel -->
    <div class="conn-tree-detail" id="schemaArtifactDetail"></div>

  </div>
</div>
